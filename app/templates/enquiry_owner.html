<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>New Enquiry Received</title>
  </head>
  <body>
    <h2>New Enquiry Received</h2>

    <h3>Customer Details</h3>
    <ul>
      <li>Name: {{ full_name }}</li>
      <li>Phone: {{ phone }}</li>
      <li>Email: {{ email }}</li>
      <li>Service Interested In: {{ service }}</li>
    </ul>

    <h3>Message</h3>
    <p>{{ message }}</p>

    <hr />

    <p>Please follow up with the customer as soon as possible.</p>
  </body>
</html>
